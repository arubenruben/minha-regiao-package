name: Build and push migrations image

# Builds migrations/Dockerfile (the small, standalone image that runs
# `alembic upgrade head` -- see its own header comment for why it only
# syncs the `minha_regiao` workspace member) and pushes it to this repo's
# GitHub Container Registry package.
#
# Every push to develop/main updates the :latest tag (and its own
# :<git-sha> tag); main additionally updates :stable, so :stable always
# points at the last migration image built from main regardless of what's
# since landed on develop.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - "migrations/**"
      - "minha_regiao/**"
      - "uv.lock"
      - ".github/workflows/migrations-image.yml"

env:
  IMAGE: ghcr.io/${{ github.repository }}/migrations

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          tags="${IMAGE}:latest,${IMAGE}:${GITHUB_SHA}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags="${tags},${IMAGE}:stable"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: migrations/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
