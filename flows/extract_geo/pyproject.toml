[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extract_geo"
version = "0.1.0"
description = "Prefect flow: extract and publish Portuguese geo-administrative reference data (cities, districts, parishes)"
requires-python = ">=3.12"

dependencies = [
    "minha_regiao",
    "prefect[docker]>=3.6.12",
    "scrapling[fetchers]>=0.4.10",
    "datasets>=5.0.0",
    "huggingface-hub>=1.23.0",
    "pandas>=2.3.0",
    "openpyxl>=3.1.5",
]

[tool.uv.sources]
minha_regiao = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
